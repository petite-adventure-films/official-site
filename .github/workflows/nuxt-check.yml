name: Nuxt dependency checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'html/**'
      - '.github/workflows/nuxt-check.yml'
      - '.github/workflows/main.yml'
      - '.github/workflows/develop.yml'
      - '.github/workflows/deploy_from_wordpress.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run typecheck
      - run: bun run test:forms
      - run: bun run test:shop-state
      - run: bun run test:dependency-overrides
      - run: bun run build
